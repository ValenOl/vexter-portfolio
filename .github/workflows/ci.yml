name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, typecheck, build, unit tests
    runs-on: ubuntu-latest
    env:
      # prisma generate needs DATABASE_URL to be a resolvable value, but
      # never actually connects to it (no migrate/db push here) -- a
      # placeholder is enough. Confirmed locally: unset DATABASE_URL makes
      # `prisma generate` fail at config-load time even though it never
      # touches the network.
      DATABASE_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Prisma generate
        run: npm run db:generate

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test

  evals:
    name: Functional eval suite (RAG + Vertex AI)
    runs-on: ubuntu-latest
    needs: test
    # Only run against main after a push, never on pull_request: PRs from
    # forks don't have access to repo secrets anyway (GitHub withholds them
    # by design), so running this job on `pull_request` would just fail
    # noisily for every external contributor. Same-repo PRs still get full
    # coverage from the `test` job; the real eval run happens once the
    # change lands on main, plus on-demand via workflow_dispatch.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Write GCP service account key
        env:
          GOOGLE_VERTEX_CREDENTIALS_JSON: ${{ secrets.GOOGLE_VERTEX_CREDENTIALS_JSON }}
        run: echo "$GOOGLE_VERTEX_CREDENTIALS_JSON" > "${{ runner.temp }}/gcp-key.json"

      - name: Prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run db:generate

      - name: Run evals
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GOOGLE_VERTEX_PROJECT: ${{ secrets.GOOGLE_VERTEX_PROJECT }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/gcp-key.json
        run: npm run eval
